# Render Blueprint: Dashboard -> New -> Blueprint -> pick this repo.
# Values marked `sync: false` are secrets: Render asks for them when the
# Blueprint is created, and they are never stored in this (public) repo.
services:
  - type: web
    name: job-hunt-agent
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_ACCESS_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: RAPIDAPI_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
